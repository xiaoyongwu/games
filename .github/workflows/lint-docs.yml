name: Lint the docs!
on:
  pull_request:
    branches: [ "master" ]
  push:
    branches: [ "master" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
permissions:
  pull-requests: write
  contents: read
jobs:
  lint-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 16.13.2
      - name: Install docs-lint
        run: npm install -g @elastic/docs-lint
      - name: Install js-yaml
        run: npm install -g js-yaml
      - name: Install strip-ansi
        run: npm install -g strip-ansi
      - name: patch the code
        run: cp index2.js /opt/hostedtoolcache/node/16.13.2/x64/lib/node_modules/@elastic/docs-lint/plugins/remark-elastic-frontmatter/index.js
      - name: Run docs-lint
        id: run_docs_lint
        run: |
          LINT=$(((docs-lint $GITHUB_WORKSPACE/docs --asciidoc) 2>&1) || true)
          echo "$LINT"
          LINT="${LINT//'%'/'%25'}"
          LINT="${LINT//$'\n'/'%0A'}"
          LINT="${LINT//$'\r'/'%0D'}"
          LINT="${LINT//$'`'/'\`'}"
          echo "::set-output name=LINT_RESULT::$LINT"
      - name: Add PR comment
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const report = `${{ steps.run_docs_lint.outputs.LINT_RESULT }}`
            if (report !== '') {
              const cleanText = report
              const errorWithContext = `**⚠️ Lint failed**\n~~~\n${cleanText}\n~~~`
              github.rest.issues.createComment({
                issue_number: 1,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: errorWithContext
              })
            } else {
              console.log("🎉 No errors!")
            }
      - name: Throw error if linter fails
        uses: actions/github-script@v9
        with:
          script: |
            const report = `${{ steps.run_docs_lint.outputs.LINT_RESULT }}`
            if (report !== '') {
              core.setFailed(report)
            } else {
              console.log("No errors!")
            }
